# Serves the built dashboard and forwards /api to the backend.
#
# This is the production counterpart of the Vite dev proxy: the
# browser talks to one origin, so the backend needs no CORS
# configuration here either.

upstream backend {
    # The compose service name. One origin, one place to change it.
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API host name, the nginx version and the backend's own
    # error pages are not the browser's business.
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ------------------------------------------------------------
    # API
    # ------------------------------------------------------------

    # The trailing slash on proxy_pass strips the /api prefix, so
    # /api/workflows reaches the backend as /workflows.
    location /api/ {
        proxy_pass http://backend/;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Let the backend's correlation id survive the hop in both
        # directions, so a browser request can be traced in the logs.
        proxy_set_header X-Request-ID $http_x_request_id;
        proxy_pass_header X-Request-ID;

        # A workflow run waits on the model, which is slower than
        # nginx's one-minute default.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;

        proxy_buffering off;
    }

    # ------------------------------------------------------------
    # STATIC FILES
    # ------------------------------------------------------------

    # Vite fingerprints these file names, so they can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html must not be cached, or a deploy keeps serving the
    # old page with references to assets that no longer exist.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Client-side routing: every unknown path is a route in the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
